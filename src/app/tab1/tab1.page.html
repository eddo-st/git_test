<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Vehículos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <app-explore-container
    *ngIf="vehiculos.length === 0"
    icon="car-outline"
    title="Tu garaje está vacío"
    description="Añade un nuevo vehículo pulsando + abajo">
  </app-explore-container>

  <div *ngIf="vehiculos.length > 0">
    <ion-card *ngFor="let vehiculo of vehiculos" color="light">
      <ion-card-header>
        <ion-card-title class="ion-flex ion-align-items-center">
          {{ vehiculo.marca }} {{ vehiculo.modelo }} ({{ vehiculo.fechaCar }})
        </ion-card-title>
        <ion-card-subtitle style="font-weight: bold">
          {{ vehiculo.matricula }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p>Alertas activas: <strong>{{ vehiculo.alertas?.length }}</strong></p>

        <div class="ion-flex ion-justify-content-between ion-align-items-center ion-margin-top">
          <ion-button fill="clear" size="small" class="ion-no-padding"
            [routerLink]="['/tabs/tab2']"
            [queryParams]="{ vehiculoId: vehiculo.id}">
            Ver revisiones
          </ion-button>

          <ion-button color="danger" fill="clear" size="small" class="ion-no-padding"
            (click)="deleteVehiculo(vehiculo)">
            Eliminar vehículo
          </ion-button>
        </div>

      </ion-card-content>

    </ion-card>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button name="add" (click)="goToAddVehiculo()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <app-explore-container name="Vehículos"></app-explore-container>
</ion-content>
