<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Alertas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Alertas</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container
    *ngIf="alertas.length === 0"
    icon="alert-outline"
    title="Tu lista de alertas está vacía"
    description="Añada una nueva alerta pulsando el botón + abajo">
  </app-explore-container>

  <div *ngIf="alertas.length > 0">
    <ion-card *ngFor="let alerta of alertas" color="light">
      <ion-card-header>
        <ion-card-title class="ion-flex ion-align-items-center">
          {{ getVehiculoInfo(alerta.vehiculoId)?.marca }}
          {{ getVehiculoInfo(alerta.vehiculoId)?.modelo }}
          {{ getVehiculoInfo(alerta.vehiculoId)?.matricula }}
        </ion-card-title>

        <ion-card-subtitle style="font-weight: bold">
          {{ alerta.tipo.toUpperCase() }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p>Fecha vencimiento: <strong>{{ alerta.fechaProxima | date:'dd/MM/yyyy' }}</strong></p>
      </ion-card-content>
    </ion-card> 
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="goToAddAlerta()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
